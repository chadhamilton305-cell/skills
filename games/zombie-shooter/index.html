<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>DEAD STREETS // Quarantine Block</title>
<style>
  html,body{
    position:fixed; inset:0;
    margin:0; padding:0; width:100%; height:100%;
    background:#0a0907; overflow:hidden;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;

  }
  #c{ display:block; width:100vw; height:100vh; background:#0a0907; touch-action:none; overscroll-behavior:none; }
  #orient{
    position:fixed; inset:0; background:#0a0907; color:#c9b98a;

  @media (orientation: portrait) and (max-aspect-ratio: 1/1){

  }

<body>
<canvas id="c"></canvas>
<div id="orient"><div>ROTATE YOUR PHONE</div><div style="font-size:38px;margin-top:10px;">&#x21BB;</div><div style="font-size:12px;opacity:.6;margin-top:10px;">LANDSCAPE MODE RECOMMENDED</div><div style="font-size:13px;margin-top:22px;color:#ff5a3c;letter-spacing:1px;">TAP HERE TO PLAY ANYWAY</div></div>
<script>
(function(){
"use strict";

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var orientEl = document.getElementById('orient');
var DPR = Math.min(window.devicePixelRatio || 1, 2.5);
var W=0, H=0;
var orientDismissed = false;

function resize(){
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  canvas.width = Math.floor(W*DPR);
  canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (H>W && !orientDismissed) orientEl.classList.add('show'); else orientEl.classList.remove('show');
  updateStickAnchors();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize,150); });
if (window.visualViewport){
  // Mobile browsers resize the *visual* viewport (not the page) when the
  // address bar shows/hides, which otherwise desyncs the canvas from what's
  // actually visible and makes the fixed-position joysticks look like they
  // "jump" or vanish off-screen.
  window.visualViewport.addEventListener('resize', resize);
  window.visualViewport.addEventListener('scroll', function(){ window.scrollTo(0,0); });
}
// Belt-and-suspenders: the page should never be able to scroll (body is
// position:fixed), but if any mobile browser quirk sneaks a scroll through
// anyway, snap it back instantly so the canvas/joysticks never drift.
window.addEventListener('scroll', function(){ window.scrollTo(0,0); }, {passive:true});
document.addEventListener('touchstart', function(e){
  if (e.target !== orientEl && !orientEl.contains(e.target)) e.preventDefault();
}, {passive:false});
function dismissOrient(e){
  orientDismissed = true;
  orientEl.classList.remove('show');
  if (e) e.preventDefault();
}
orientEl.addEventListener('touchstart', dismissOrient, {passive:false});
orientEl.addEventListener('click', dismissOrient);

// ---------- Audio ----------
var actx = null;
function ensureAudio(){
  if (!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  } else if (actx.state === 'suspended'){ actx.resume(); }
}
function tone(freq, dur, type, vol, slideTo){
  if (!actx) return;
  var t0 = actx.currentTime;
  var osc = actx.createOscillator();
  var gain = actx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(slideTo,1), t0+dur);
  gain.gain.setValueAtTime(vol||0.15, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
var noiseBuf = null;
function getNoiseBuf(){
  if (!actx) return null;
  if (!noiseBuf){
    var len = actx.sampleRate*0.3;
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len,1.5);
  }
  return noiseBuf;
}
function noiseBurst(vol, dur){
  if (!actx) return;
  var buf = getNoiseBuf(); if (!buf) return;
  var src = actx.createBufferSource(); src.buffer = buf;
  var gain = actx.createGain();
  gain.gain.setValueAtTime(vol||0.2, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+(dur||0.25));
  var filt = actx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=1800;
  src.connect(filt); filt.connect(gain); gain.connect(actx.destination);
  src.start();
}
var SFX = {
  shoot:function(){ tone(880,0.06,'square',0.05,520); },
  hit:function(){ noiseBurst(0.12,0.08); },
  death:function(){ tone(300,0.25,'sawtooth',0.12,40); },
  hurt:function(){ tone(160,0.18,'sawtooth',0.15,60); },
  pickup:function(){ tone(440,0.08,'sine',0.12,880); setTimeout(function(){tone(880,0.1,'sine',0.1,1320);},70); },
  wave:function(){ tone(220,0.4,'sawtooth',0.1,440); },
  nuke:function(){ noiseBurst(0.3,0.6); tone(80,0.6,'sawtooth',0.2,20); },
  gameover:function(){ tone(300,0.6,'sawtooth',0.15,60); }
};

// ---------- Input: dual virtual joysticks ----------
// Each stick lives at a FIXED screen anchor (bottom-left / bottom-right)
// that never moves and is always drawn, so the player can find it by feel
// without looking. Touching anywhere on that half of the screen grabs the
// stick; dragging is measured from the fixed anchor, not from wherever the
// finger landed. Each stick is fully independent: it activates the instant
// its half of the screen is touched and stays live until THAT SAME finger
// (matched by identifier) lifts. Every event reconciles against e.touches
// (the authoritative "what's still down" list) so a flaky touchend/
// touchcancel on one finger can never drop or freeze the other stick.
var stickL = {active:false, id:null, anchorX:0, anchorY:0, baseX:0, baseY:0, x:0, y:0, dx:0, dy:0, lastClientX:null, lastClientY:null};
var stickR = {active:false, id:null, anchorX:0, anchorY:0, baseX:0, baseY:0, x:0, y:0, dx:0, dy:0, lastClientX:null, lastClientY:null};
var STICK_R_MAX = 85;
var STICK_DEADZONE = 0.06;

function updateStickAnchors(){
  var marginX = Math.min(150, W*0.22);
  var anchorY = H - Math.min(140, H*0.26);
  stickL.anchorX = marginX; stickL.anchorY = anchorY;
  stickR.anchorX = W - marginX; stickR.anchorY = anchorY;
  // The anchor IS the pivot, always -- if the mobile browser's address bar
  // hides/shows mid-drag and shifts the visual viewport, the base must move
  // with it or the ring and knob desync (ring jumps to the new anchor while
  // the knob stays pinned to stale math, looking like the stick "vanished").
  stickL.baseX = stickL.anchorX; stickL.baseY = stickL.anchorY;
  stickR.baseX = stickR.anchorX; stickR.baseY = stickR.anchorY;
  if (!stickL.active){ stickL.x=stickL.anchorX; stickL.y=stickL.anchorY; }
  else if (stickL.lastClientX != null) stickMoveTo(stickL, {clientX:stickL.lastClientX, clientY:stickL.lastClientY});
  if (!stickR.active){ stickR.x=stickR.anchorX; stickR.y=stickR.anchorY; }
  else if (stickR.lastClientX != null) stickMoveTo(stickR, {clientX:stickR.lastClientX, clientY:stickR.lastClientY});
}

function findTouchById(touchList, id){
  for (var i=0;i<touchList.length;i++){ if (touchList[i].identifier === id) return touchList[i]; }
  return null;
}

function stickActivate(s, t){
  s.active = true; s.id = t.identifier;
  s.baseX = s.anchorX; s.baseY = s.anchorY;
  stickMoveTo(s, t);
}
function stickRelease(s){
  s.active=false; s.id=null; s.dx=0; s.dy=0;
  s.baseX = s.anchorX; s.baseY = s.anchorY;
  s.x = s.anchorX; s.y = s.anchorY;
  s.lastClientX = null; s.lastClientY = null;
}
function stickMoveTo(s, t){
  s.lastClientX = t.clientX; s.lastClientY = t.clientY;
  var dx = t.clientX - s.baseX, dy = t.clientY - s.baseY;
  var d = Math.sqrt(dx*dx+dy*dy);
  if (d > STICK_R_MAX){ dx = dx/d*STICK_R_MAX; dy = dy/d*STICK_R_MAX; d = STICK_R_MAX; }
  s.x = s.baseX+dx; s.y = s.baseY+dy;
  var norm = d/STICK_R_MAX;
  if (norm < STICK_DEADZONE){
    s.dx = 0; s.dy = 0;
  } else {
    var ramp = (norm-STICK_DEADZONE)/(1-STICK_DEADZONE);
    s.dx = (dx/d)*ramp; s.dy = (dy/d)*ramp;
  }
}

// Safety net for the rare missed-touchend case (finger lifted but the
// browser never fired the event): only checked at touchstart time, which
// fires far less often than touchmove, so a single coalesced/dropped
// touchmove snapshot can never falsely release a stick mid-drag (that was
// causing the joystick to "bounce back to center" during fast/wide drags).
function reconcileTouches(touchList){
  if (stickL.active && !findTouchById(touchList, stickL.id)) stickRelease(stickL);
  if (stickR.active && !findTouchById(touchList, stickR.id)) stickRelease(stickR);
}

canvas.addEventListener('touchstart', function(e){
  ensureAudio();
  if (gameState === 'start'){ requestFS(); startGame(); }
  else if (gameState === 'gameover'){ resetGame(); gameState='start'; startGame(); }
  reconcileTouches(e.touches);
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    var isLeft = t.clientX < W/2;
    var s = isLeft ? stickL : stickR;
    if (!s.active) stickActivate(s, t);
  }
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchmove', function(e){
  // Deliberately does NOT reconcile against e.touches here -- only matches
  // and updates sticks whose id is present. A finger is only ever released
  // by an explicit touchend/touchcancel naming that exact identifier below.
  for (var i=0;i<e.touches.length;i++){
    var t = e.touches[i];
    if (stickL.active && stickL.id === t.identifier) stickMoveTo(stickL, t);
    else if (stickR.active && stickR.id === t.identifier) stickMoveTo(stickR, t);
  }
  e.preventDefault();
}, {passive:false});
function touchEndHandler(e){
  for (var i=0;i<e.changedTouches.length;i++){
    var id = e.changedTouches[i].identifier;
    if (stickL.active && stickL.id === id) stickRelease(stickL);
    if (stickR.active && stickR.id === id) stickRelease(stickR);
  }
  e.preventDefault();
}
canvas.addEventListener('touchend', touchEndHandler, {passive:false});
canvas.addEventListener('touchcancel', touchEndHandler, {passive:false});

// stickL/stickR now exist, so it's safe to run the first real layout pass.
resize();

// Mouse fallback (desktop preview)
var mouseDown=false, mouseBtn=0;
canvas.addEventListener('mousedown', function(e){
  ensureAudio();
  if (gameState === 'start'){ startGame(); return; }
  if (gameState === 'gameover'){ resetGame(); gameState='start'; startGame(); return; }
  mouseDown = true; mouseBtn = e.button;
  var s = e.clientX < W/2 ? stickL : stickR;
  s.active=true; s.id='mouse';
  s.baseX=s.anchorX; s.baseY=s.anchorY;
  stickMoveTo(s, {clientX:e.clientX, clientY:e.clientY});
});
window.addEventListener('mousemove', function(e){
  if (!mouseDown) return;
  var s = (stickL.active && stickL.id==='mouse') ? stickL : (stickR.active && stickR.id==='mouse' ? stickR : null);
  if (!s) return;
  stickMoveTo(s, {clientX:e.clientX, clientY:e.clientY});
});
window.addEventListener('mouseup', function(){
  mouseDown=false;
  if (stickL.id==='mouse') stickRelease(stickL);
  if (stickR.id==='mouse') stickRelease(stickR);
});

// Block iOS pinch-zoom / Safari gesture events and any stray scroll
['gesturestart','gesturechange','gestureend'].forEach(function(evt){
  document.addEventListener(evt, function(e){ e.preventDefault(); });
});
document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('dblclick', function(e){ e.preventDefault(); });

function requestFS(){
  var el = document.documentElement;
  var req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req){
    try{
      var p = req.call(el);
      if (p && p.catch) p.catch(function(){});
    }catch(e){}
  }
}

// ---------- Game constants ----------
var ARENA_W = 2200, ARENA_H = 1300;
var GRID = 90;

// ---------- Game state ----------
var gameState = 'start'; // start | playing | gameover
var camX=0, camY=0, shake=0;
var player, bullets, zombies, particles, pickups, floaters, decals, embers, obstacles;
var wave, waveTimer, spawnQueue, spawnTimer, waveBanner, waveBannerTime, betweenWaves, betweenTimer;
var killsThisWave, totalKills;
var finalScore=0, finalWave=0;

var OBSTACLE_DEFS = {
  dumpster:{w:74, h:42},
  crate:{w:34, h:34},
  car:{w:150, h:64},
  trash:{w:30, h:24}
};

function generateObstacles(){
  var list = [];
  var counts = {dumpster:6, crate:8, car:3, trash:10};
  for (var type in counts){
    for (var i=0;i<counts[type];i++){
      var def = OBSTACLE_DEFS[type];
      var x=0, y=0, tries=0, ok=false;
      while (tries<20 && !ok){
        x = (Math.random()-0.5)*(ARENA_W-160);
        y = (Math.random()-0.5)*(ARENA_H-160);
        tries++;
        if (Math.hypot(x,y) < 260) continue;
        ok = true;
        for (var j=0;j<list.length;j++){
          var o = list[j];
          if (Math.abs(x-o.x) < (def.w+o.w)*0.6 && Math.abs(y-o.y) < (def.h+o.h)*0.6){ ok=false; break; }
        }
      }
      if (ok) list.push({type:type, x:x, y:y, w:def.w, h:def.h, rot:(Math.random()-0.5)*0.5, seed:Math.random()*9});
    }
  }
  return list;
}

// Push a circular entity out of any rectangular obstacle it overlaps.
// "solid" obstacles (dumpster/car/crate) block movement; trash is decorative.
function resolveObstacles(entity){
  for (var i=0;i<obstacles.length;i++){
    var o = obstacles[i];
    if (o.type==='trash') continue;
    var hw = o.w/2, hh = o.h/2;
    var cx = Math.max(o.x-hw, Math.min(entity.x, o.x+hw));
    var cy = Math.max(o.y-hh, Math.min(entity.y, o.y+hh));
    var dx = entity.x-cx, dy = entity.y-cy;
    var distSq = dx*dx+dy*dy;
    var r = entity.r||16;
    if (distSq < r*r){
      var dist = Math.sqrt(distSq)||0.001;
      var overlap = r-dist;
      entity.x += (dx/dist)*overlap;
      entity.y += (dy/dist)*overlap;
    }
  }
}

function resetGame(){
  player = {
    x:0, y:0, angle:0, hp:100, maxHp:100,
    speed:280, fireRate:6.5, lastShot:0,
    shieldTime:0, rapidTime:0, invuln:0,
    shotgunTime:0, pierceTime:0, freezeTime:0, magnumTime:0,
    score:0, combo:1, comboTimer:0,
    muzzleFlash:0, walkPhase:0, r:16
  };
  bullets = []; zombies = []; particles = []; pickups = []; floaters = [];
  decals = []; embers = [];
  obstacles = generateObstacles();
  wave = 0; waveBanner=''; waveBannerTime=0; betweenWaves=true; betweenTimer=1.2;
  killsThisWave=0; totalKills=0; spawnQueue=0; spawnTimer=0;
  camX=0; camY=0; shake=0;
}
resetGame();

function startGame(){
  gameState = 'playing';
}

function addFloater(x,y,text,color){
  floaters.push({x:x,y:y,text:text,color:color,life:0.9,maxLife:0.9,vy:-60});
}

function spawnParticles(x,y,color,n,speed,life){
  for (var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2;
    var sp = (0.4+Math.random()*0.6)*speed;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:life,maxLife:life,color:color,size:2+Math.random()*3});
  }
}

var DECAL_MAX = 70;
function addDecal(x,y,r,color){
  var blobs = [];
  var n = 3+Math.floor(Math.random()*3);
  for (var i=0;i<n;i++){
    blobs.push({ox:(Math.random()-0.5)*r*1.5, oy:(Math.random()-0.5)*r*1.5, rr:r*(0.35+Math.random()*0.55)});
  }
  decals.push({x:x,y:y,color:color,alpha:0.55,blobs:blobs});
  if (decals.length>DECAL_MAX) decals.shift();
}

var EMBER_MAX = 28;
function updateEmbers(dt){
  for (var i=embers.length-1;i>=0;i--){
    var e = embers[i];
    e.x += e.vx*dt; e.y += e.vy*dt; e.life -= dt;
    if (e.life<=0) embers.splice(i,1);
  }
  if (embers.length<EMBER_MAX && Math.random()<dt*6){
    var a = Math.random()*Math.PI*2, r = Math.random()*Math.max(W,H)*0.7;
    embers.push({
      x:player.x+Math.cos(a)*r, y:player.y+Math.sin(a)*r,
      vx:(Math.random()-0.5)*10, vy:-8-Math.random()*14,
      life:4+Math.random()*3, maxLife:7, size:1+Math.random()*1.8
    });
  }
}

function nextWave(){
  wave++;
  betweenWaves = false;
  var isBoss = (wave % 5 === 0);
  var baseCount = 6 + wave*3;
  spawnQueue = isBoss ? Math.floor(baseCount*0.5)+1 : baseCount;
  spawnTimer = 0;
  killsThisWave = 0;
  waveBanner = isBoss ? ('BOSS WAVE ' + wave) : ('WAVE ' + wave);
  waveBannerTime = 2.2;
  SFX.wave();
}

function zombieTypeForWave(){
  var r = Math.random();
  var w = wave;
  if (w % 5 === 0 && spawnQueue === 1){
    return 'boss';
  }
  var runnerChance = Math.min(0.15 + w*0.02, 0.4);
  var bruteChance = Math.min(0.05 + w*0.025, 0.3);
  if (r < bruteChance) return 'brute';
  if (r < bruteChance+runnerChance) return 'runner';
  return 'walker';
}

var ZTYPES = {
  walker:{hp:30, speed:70, r:22, dmg:8, color:'#39ff8a', glow:'#0fff7a', score:10,
    skin:'#1d6b3d', skinHi:'#39ff8a', eye:'#c6ffe0', blood:'#0c3a1e'},
  runner:{hp:18, speed:150, r:17, dmg:6, color:'#ff7a39', glow:'#ff5500', score:15,
    skin:'#8a2f12', skinHi:'#ff7a39', eye:'#ffd9b0', blood:'#4a1606'},
  brute:{hp:120, speed:48, r:34, dmg:18, color:'#b53bff', glow:'#9000ff', score:30,
    skin:'#4a1170', skinHi:'#b53bff', eye:'#ecd0ff', blood:'#2b0a44'},
  boss:{hp:900, speed:40, r:62, dmg:30, color:'#ff2050', glow:'#ff0040', score:300,
    skin:'#5c0018', skinHi:'#ff2050', eye:'#ffd0de', blood:'#400012'}
};

// Each weapon pickup counters a specific zombie threat:
//  - shotgun: wide pellet cone, shreds clustered fast Runners
//  - piercer: bullets punch through several targets, great vs lined-up Brutes/Bosses trailed by swarms
//  - freeze:  slows every zombie on screen, buys breathing room when Runners swarm you
//  - magnum:  huge per-shot damage + knockback, the answer to tanky Brutes and Bosses
var PICKUP_DEFS = {
  health:  {color:'#ff3b6e', sym:'+',  label:'+HEALTH'},
  rapid:   {color:'#ffe93b', sym:'R',  label:'RAPID FIRE'},
  shield:  {color:'#3bbcff', sym:'S',  label:'SHIELD'},
  shotgun: {color:'#ff9a3c', sym:'SG', label:'SHOTGUN'},
  piercer: {color:'#7be8ff', sym:'P',  label:'PIERCING ROUNDS'},
  freeze:  {color:'#8fd9ff', sym:'F',  label:'FREEZE PULSE'},
  magnum:  {color:'#ff5a3c', sym:'M',  label:'MAGNUM'},
  nuke:    {color:'#b53bff', sym:'N',  label:'NUKE!'}
};

var MAX_ZOMBIES = 140;
var zombieUidSeq = 1;

function spawnZombie(type){
  if (zombies.length >= MAX_ZOMBIES) return;
  var def = ZTYPES[type];
  var x=0, y=0, tries=0;
  do {
    x = (Math.random()-0.5)*(ARENA_W-80);
    y = (Math.random()-0.5)*(ARENA_H-80);
    tries++;
  } while (tries<12 && Math.hypot(x-player.x, y-player.y) < 500);
  zombies.push({
    uid:zombieUidSeq++,
    x:x, y:y, type:type, hp:def.hp*(1+wave*0.04), maxHp:def.hp*(1+wave*0.04),
    speed:def.speed, r:def.r, dmg:def.dmg, color:def.color, glow:def.glow, score:def.score,
    skin:def.skin, skinHi:def.skinHi, eye:def.eye, blood:def.blood,
    flash:0, wob:Math.random()*Math.PI*2, hitCooldown:0,
    angle:Math.random()*Math.PI*2, anim:Math.random()*Math.PI*2
  });
}

function safeVibrate(ms){
  try{ if (navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}

function damagePlayer(amount){
  if (player.shieldTime > 0 || player.invuln > 0) return;
  player.hp -= amount;
  player.invuln = 0.25;
  shake = Math.min(shake+8, 22);
  SFX.hurt();
  safeVibrate(40);
  if (player.hp <= 0){
    player.hp = 0;
    finalScore = Math.floor(player.score);
    finalWave = wave;
    gameState = 'gameover';
    SFX.gameover();
  }
}

function killZombie(z, idx){
  spawnParticles(z.x,z.y,z.glow,16,260,0.55);
  addDecal(z.x,z.y,z.r*(z.type==='boss'?1.8:1.2),z.blood);
  shake = Math.min(shake+ (z.type==='boss'?16:3), 22);
  var gained = Math.floor(z.score*player.combo);
  player.score += gained;
  addFloater(z.x, z.y-20, '+'+gained, z.glow);
  player.combo = Math.min(player.combo+0.1, 5);
  player.comboTimer = 2.2;
  totalKills++; killsThisWave++;
  safeVibrate(z.type==='boss'?80:15);
  SFX.death();
  if (Math.random() < (z.type==='boss'?1:0.14)){
    var types = ['health','rapid','shield','shotgun','piercer','freeze','magnum'];
    var t = types[Math.floor(Math.random()*types.length)];
    if (Math.random()<0.05 || z.type==='boss') t='nuke';
    pickups.push({x:z.x,y:z.y,type:t,bob:0});
  }
  zombies.splice(idx,1);
}

function makeBullet(angle, speed, dmg, pierce, knockback){
  return {
    x: player.x + Math.cos(angle)*30,
    y: player.y + Math.sin(angle)*30,
    vx: Math.cos(angle)*speed,
    vy: Math.sin(angle)*speed,
    life: 1.1, dmg: dmg, pierce: pierce, knockback: knockback
  };
}

function fireBullet(){
  var now = performance.now()/1000;
  var rateMul = (player.rapidTime>0?2.2:1) * (player.magnumTime>0?0.55:1);
  var rate = 1/(player.fireRate * rateMul);
  if (now - player.lastShot < rate) return;
  player.lastShot = now;
  var speed = 760;
  var dmg = 11 + (player.rapidTime>0?3:0) + (player.magnumTime>0?22:0);
  var pierce = player.pierceTime>0;
  var knockback = player.magnumTime>0 ? 30 : 0;

  if (player.shotgunTime>0){
    var pellets = 5, spread = 0.5;
    for (var i=0;i<pellets;i++){
      var off = (i-(pellets-1)/2)/(pellets-1)*spread;
      bullets.push(makeBullet(player.angle+off, speed, Math.max(5,Math.floor(dmg*0.55)), pierce, knockback));
    }
  } else {
    bullets.push(makeBullet(player.angle, speed, dmg, pierce, knockback));
  }
  player.muzzleFlash = 0.06;
  SFX.shoot();
}

// ---------- Update ----------
var lastT = performance.now();
function update(dt){
  if (gameState !== 'playing') return;

  // movement
  var mvx = stickL.dx||0, mvy = stickL.dy||0;
  var mlen = Math.sqrt(mvx*mvx+mvy*mvy);
  if (mlen > 1){ mvx/=mlen; mvy/=mlen; }
  player.x += mvx*player.speed*dt;
  player.y += mvy*player.speed*dt;
  var halfW = ARENA_W/2-30, halfH = ARENA_H/2-30;
  player.x = Math.max(-halfW, Math.min(halfW, player.x));
  player.y = Math.max(-halfH, Math.min(halfH, player.y));
  resolveObstacles(player);
  if (mlen > 0.1) player.walkPhase += dt*9;
  if (player.muzzleFlash>0) player.muzzleFlash -= dt;

  // aim/fire
  var aim = Math.sqrt(stickR.dx*stickR.dx + stickR.dy*stickR.dy);
  if (aim > 0.18){
    player.angle = Math.atan2(stickR.dy, stickR.dx);
    fireBullet();
  } else if (mlen > 0.1){
    player.angle = Math.atan2(mvy, mvx);
  }

  if (player.invuln>0) player.invuln -= dt;
  if (player.shieldTime>0) player.shieldTime -= dt;
  if (player.rapidTime>0) player.rapidTime -= dt;
  if (player.shotgunTime>0) player.shotgunTime -= dt;
  if (player.pierceTime>0) player.pierceTime -= dt;
  if (player.freezeTime>0) player.freezeTime -= dt;
  if (player.magnumTime>0) player.magnumTime -= dt;
  if (player.comboTimer>0){ player.comboTimer -= dt; if (player.comboTimer<=0) player.combo = 1; }

  // bullets
  for (var i=bullets.length-1;i>=0;i--){
    var b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (b.life<=0){ bullets.splice(i,1); continue; }
    if (Math.abs(b.x) > ARENA_W/2 || Math.abs(b.y) > ARENA_H/2){ bullets.splice(i,1); continue; }
    var hitObstacle = false;
    for (var oi=0;oi<obstacles.length;oi++){
      var ob = obstacles[oi];
      if (ob.type==='trash') continue;
      if (Math.abs(b.x-ob.x) < ob.w/2 && Math.abs(b.y-ob.y) < ob.h/2){ hitObstacle = true; break; }
    }
    if (hitObstacle){ spawnParticles(b.x,b.y,'#cfa15a',3,90,0.2); bullets.splice(i,1); continue; }
  }

  // zombies
  for (var zi=zombies.length-1; zi>=0; zi--){
    var z = zombies[zi];
    var dx = player.x - z.x, dy = player.y - z.y;
    var dist = Math.sqrt(dx*dx+dy*dy) || 1;
    var nx = dx/dist, ny = dy/dist;
    z.wob += dt*6;
    var perp = Math.sin(z.wob)*0.4;
    var mx = nx - ny*perp, my = ny + nx*perp;
    var mlen2 = Math.sqrt(mx*mx+my*my)||1;
    var speedMul = player.freezeTime>0 ? 0.32 : 1;
    z.x += (mx/mlen2)*z.speed*speedMul*dt;
    z.y += (my/mlen2)*z.speed*speedMul*dt;
    z.x = Math.max(-ARENA_W/2+20, Math.min(ARENA_W/2-20, z.x));
    z.y = Math.max(-ARENA_H/2+20, Math.min(ARENA_H/2-20, z.y));
    resolveObstacles(z);
    z.angle = Math.atan2(my/mlen2, mx/mlen2);
    z.anim += dt*(0.6+z.speed*0.05);
    if (z.flash>0) z.flash -= dt;
    if (z.hitCooldown>0) z.hitCooldown -= dt;

    // separation from other zombies (light)
    for (var zj=0; zj<zombies.length; zj++){
      if (zj===zi) continue;
      var o = zombies[zj];
      var sx = z.x-o.x, sy=z.y-o.y;
      var sd = Math.sqrt(sx*sx+sy*sy);
      var minD = z.r+o.r;
      if (sd>0 && sd < minD){
        var push = (minD-sd)/minD*40*dt;
        z.x += (sx/sd)*push; z.y += (sy/sd)*push;
      }
    }

    // contact damage
    if (dist < z.r+24 && z.hitCooldown<=0){
      damagePlayer(z.dmg);
      z.hitCooldown = 0.6;
    }

    // bullet collisions
    for (var bi=bullets.length-1; bi>=0; bi--){
      var bl = bullets[bi];
      if (bl.pierce && bl.hitMap && bl.hitMap[z.uid]) continue;
      var bdx = bl.x-z.x, bdy = bl.y-z.y;
      var bd = Math.sqrt(bdx*bdx+bdy*bdy);
      if (bd < z.r+6){
        z.hp -= bl.dmg;
        z.flash = 0.08;
        spawnParticles(bl.x,bl.y,z.glow,4,140,0.25);
        if (bl.knockback){
          var bdlen = Math.sqrt(bl.vx*bl.vx+bl.vy*bl.vy)||1;
          z.x += (bl.vx/bdlen)*bl.knockback; z.y += (bl.vy/bdlen)*bl.knockback;
        }
        SFX.hit();
        var dead = z.hp<=0;
        if (dead) killZombie(z, zi);
        if (bl.pierce){
          bl.hitMap = bl.hitMap || {};
          bl.hitMap[z.uid] = true;
          bl.pierceCount = (bl.pierceCount||0)+1;
          if (bl.pierceCount >= 3) bullets.splice(bi,1);
        } else {
          bullets.splice(bi,1);
        }
        if (dead) break;
      }
    }
  }

  // particles
  for (var pi=particles.length-1; pi>=0; pi--){
    var p = particles[pi];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= dt;
    if (p.life<=0) particles.splice(pi,1);
  }

  // floaters
  for (var fi=floaters.length-1; fi>=0; fi--){
    var fl = floaters[fi];
    fl.y += fl.vy*dt; fl.life -= dt;
    if (fl.life<=0) floaters.splice(fi,1);
  }

  // pickups
  for (var pk=pickups.length-1; pk>=0; pk--){
    var pu = pickups[pk];
    pu.bob += dt*3;
    var pdx = player.x-pu.x, pdy = player.y-pu.y;
    var pdist = Math.sqrt(pdx*pdx+pdy*pdy);
    if (pdist < 36){
      applyPickup(pu.type);
      pickups.splice(pk,1);
    }
  }

  // decals fade
  for (var di=decals.length-1; di>=0; di--){
    decals[di].alpha -= dt*0.035;
    if (decals[di].alpha<=0.02) decals.splice(di,1);
  }
  updateEmbers(dt);

  // shake decay
  if (shake>0) shake = Math.max(0, shake-dt*40);

  // wave banner
  if (waveBannerTime>0) waveBannerTime -= dt;

  // wave/spawn logic
  if (betweenWaves){
    betweenTimer -= dt;
    if (betweenTimer<=0) nextWave();
  } else {
    spawnTimer -= dt;
    var interval = Math.max(0.18, 0.9 - wave*0.04);
    if (spawnTimer<=0 && spawnQueue>0){
      spawnZombie(zombieTypeForWave());
      spawnQueue--;
      spawnTimer = interval;
    }
    if (spawnQueue<=0 && zombies.length===0){
      betweenWaves = true; betweenTimer = 2.0;
      player.score += 50*wave;
      addFloater(player.x, player.y-60, 'WAVE CLEAR +'+(50*wave), '#e8b04a');
    }
  }
}

function applyPickup(type){
  SFX.pickup();
  safeVibrate(25);
  var def = PICKUP_DEFS[type];
  if (type==='health'){ player.hp = Math.min(player.maxHp, player.hp+35); }
  else if (type==='rapid'){ player.rapidTime = 8; }
  else if (type==='shield'){ player.shieldTime = 7; }
  else if (type==='shotgun'){ player.shotgunTime = 10; }
  else if (type==='piercer'){ player.pierceTime = 10; }
  else if (type==='freeze'){ player.freezeTime = 6; }
  else if (type==='magnum'){ player.magnumTime = 10; }
  else if (type==='nuke'){
    SFX.nuke(); shake = 22;
    for (var i=zombies.length-1;i>=0;i--){
      spawnParticles(zombies[i].x,zombies[i].y,zombies[i].glow,10,300,0.6);
      player.score += Math.floor(zombies[i].score*player.combo);
      totalKills++;
      zombies.splice(i,1);
    }
  }
  addFloater(player.x,player.y-30,def.label,def.color);
}

// ---------- Draw ----------
function worldToScreen(x,y){
  return [x-camX+W/2, y-camY+H/2];
}

function drawGlowCircle(x,y,r,color,glow,alpha){
  ctx.save();
  ctx.globalAlpha = alpha===undefined?1:alpha;
  ctx.shadowColor = glow||color;
  ctx.shadowBlur = 18;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawZombie(zz, sx, sy){
  var scale = zz.r/22;
  var legSwing = Math.sin(zz.anim)*0.6;
  var armSwing = Math.sin(zz.anim+Math.PI)*0.5;
  var flashed = zz.flash>0;
  var skin = flashed?'#ffffff':zz.skin;
  var hi = flashed?'#ffffff':zz.skinHi;
  var eye = flashed?'#ffffff':zz.eye;

  ctx.save();
  ctx.translate(sx,sy);
  ctx.rotate(zz.angle||0);
  ctx.shadowColor = hi; ctx.shadowBlur = 13;

  // legs, dragging/shambling
  ctx.strokeStyle = skin; ctx.lineWidth = 6*scale; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-4*scale, 4*scale);
  ctx.lineTo(-13*scale - legSwing*7*scale, 13*scale + Math.abs(legSwing)*4*scale);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-4*scale, -4*scale);
  ctx.lineTo(-13*scale + legSwing*7*scale, -13*scale - Math.abs(legSwing)*4*scale);
  ctx.stroke();

  // torso
  var tg = ctx.createRadialGradient(2*scale,0,2*scale, 0,0,13*scale);
  tg.addColorStop(0, hi); tg.addColorStop(1, skin);
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.ellipse(0,0, 11*scale, 8.5*scale, 0, 0, Math.PI*2);
  ctx.fill();

  // arms reaching toward target
  ctx.strokeStyle = skin; ctx.lineWidth = 4.5*scale;
  ctx.beginPath();
  ctx.moveTo(3*scale, 5.5*scale);
  ctx.lineTo(17*scale + armSwing*6*scale, 9*scale + armSwing*3*scale);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(3*scale, -5.5*scale);
  ctx.lineTo(17*scale - armSwing*6*scale, -9*scale - armSwing*3*scale);
  ctx.stroke();

  // head
  ctx.fillStyle = hi;
  ctx.beginPath(); ctx.arc(8*scale, 0, 6.5*scale, 0, Math.PI*2); ctx.fill();

  // glowing eyes
  ctx.shadowBlur = 9; ctx.shadowColor = eye; ctx.fillStyle = eye;
  ctx.beginPath(); ctx.arc(10.5*scale, -2.3*scale, 1.5*scale, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(10.5*scale, 2.3*scale, 1.5*scale, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

function drawBoss(zz, sx, sy){
  var pulse = 0.85+Math.sin(performance.now()/200)*0.15;
  var flashed = zz.flash>0;
  var skin = flashed?'#ffffff':zz.skin, hi = flashed?'#ffffff':zz.skinHi, eye = flashed?'#ffffff':zz.eye;

  ctx.save();
  ctx.translate(sx,sy);
  ctx.rotate(zz.angle||0);

  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = hi; ctx.shadowColor = hi; ctx.shadowBlur = 30; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0,0, zz.r*1.5*pulse, 0, Math.PI*2); ctx.stroke();
  ctx.restore();

  ctx.shadowColor = hi; ctx.shadowBlur = 22;
  ctx.fillStyle = skin;
  for (var i=0;i<8;i++){
    var a = i/8*Math.PI*2 + zz.anim*0.3;
    var bx = Math.cos(a)*zz.r*0.6, by = Math.sin(a)*zz.r*0.6;
    var tx = Math.cos(a)*zz.r*1.15, ty = Math.sin(a)*zz.r*1.15;
    ctx.beginPath();
    ctx.moveTo(bx+Math.cos(a+1.6)*4, by+Math.sin(a+1.6)*4);
    ctx.lineTo(tx,ty);
    ctx.lineTo(bx+Math.cos(a-1.6)*4, by+Math.sin(a-1.6)*4);
    ctx.closePath(); ctx.fill();
  }

  var g = ctx.createRadialGradient(0,0,zz.r*0.2,0,0,zz.r);
  g.addColorStop(0,hi); g.addColorStop(1,skin);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0, zz.r*0.85, 0, Math.PI*2); ctx.fill();

  ctx.shadowBlur = 18; ctx.shadowColor = eye; ctx.fillStyle = eye;
  ctx.beginPath(); ctx.arc(zz.r*0.15,0, zz.r*0.22*pulse, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(zz.r*0.55,-zz.r*0.3, zz.r*0.09, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(zz.r*0.55, zz.r*0.3, zz.r*0.09, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

function drawObstacle(o, sx, sy){
  ctx.save();
  ctx.translate(sx,sy);
  ctx.rotate(o.rot);
  if (o.type==='dumpster'){
    var g = ctx.createLinearGradient(0,-o.h/2,0,o.h/2);
    g.addColorStop(0,'#3c4a36'); g.addColorStop(1,'#1d2519');
    ctx.fillStyle = g;
    ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
    ctx.strokeStyle = '#10150d'; ctx.lineWidth=2; ctx.strokeRect(-o.w/2,-o.h/2,o.w,o.h);
    ctx.fillStyle = '#2a3526';
    ctx.fillRect(-o.w/2+3,-o.h/2-6,o.w-6,8);
    ctx.strokeStyle='rgba(160,90,40,0.5)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-o.w/2+8,-o.h/2+4); ctx.lineTo(-o.w/2+22,o.h/2-3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o.w/2-14,-o.h/2+10); ctx.lineTo(o.w/2-4,o.h/2-2); ctx.stroke();
  } else if (o.type==='crate'){
    ctx.fillStyle = '#5a4326';
    ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
    ctx.strokeStyle = '#2e2210'; ctx.lineWidth=2;
    ctx.strokeRect(-o.w/2,-o.h/2,o.w,o.h);
    ctx.beginPath(); ctx.moveTo(-o.w/2,-o.h/2); ctx.lineTo(o.w/2,o.h/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o.w/2,-o.h/2); ctx.lineTo(-o.w/2,o.h/2); ctx.stroke();
  } else if (o.type==='car'){
    var g2 = ctx.createLinearGradient(0,-o.h/2,0,o.h/2);
    g2.addColorStop(0,'#3a3530'); g2.addColorStop(1,'#171513');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.moveTo(-o.w/2,-o.h*0.3); ctx.lineTo(-o.w*0.3,-o.h/2); ctx.lineTo(o.w*0.25,-o.h/2);
    ctx.lineTo(o.w/2,-o.h*0.25); ctx.lineTo(o.w/2,o.h*0.3); ctx.lineTo(-o.w/2,o.h*0.3);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='rgba(120,150,140,0.35)';
    ctx.fillRect(-o.w*0.15,-o.h*0.46,o.w*0.4,o.h*0.22);
    ctx.fillStyle='#6b1810';
    ctx.beginPath(); ctx.arc(-o.w*0.42,o.h*0.34,5,0,Math.PI*2); ctx.arc(o.w*0.4,o.h*0.34,5,0,Math.PI*2); ctx.fill();
  } else if (o.type==='trash'){
    ctx.fillStyle = '#4a4234';
    for (var i=0;i<4;i++){
      var a = o.seed+i*1.7;
      ctx.beginPath(); ctx.ellipse(Math.cos(a)*6,Math.sin(a)*5,7,4,a,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#0a0907';
  ctx.fillRect(0,0,W,H);

  var sx = (Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
  ctx.save();
  ctx.translate(sx,sy);

  // cracked pavement grid
  ctx.save();
  ctx.strokeStyle = 'rgba(150,140,120,0.07)';
  ctx.lineWidth = 1;
  var offX = ((camX % GRID)+GRID)%GRID;
  var offY = ((camY % GRID)+GRID)%GRID;
  for (var gx=-offX; gx<W; gx+=GRID){
    ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke();
  }
  for (var gy=-offY; gy<H; gy+=GRID){
    ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
  }
  ctx.restore();

  // alley boundary wall (brick, rectangular city block)
  var bl = worldToScreen(-ARENA_W/2,-ARENA_H/2);
  ctx.save();
  ctx.strokeStyle = '#5a4636';
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 12;
  ctx.lineWidth = 10;
  ctx.globalAlpha = 0.9;
  ctx.strokeRect(bl[0],bl[1],ARENA_W,ARENA_H);
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = '#2a1f15'; ctx.lineWidth = 3;
  for (var bw=20; bw<Math.max(ARENA_W,ARENA_H); bw+=26){
    ctx.beginPath(); ctx.moveTo(bl[0],bl[1]+ (bw % ARENA_H)); ctx.lineTo(bl[0]+ARENA_W,bl[1]+(bw % ARENA_H)); ctx.stroke();
  }
  ctx.restore();

  // obstacles (drawn before atmosphere/decals so they sit on the street)
  for (var ob=0; ob<obstacles.length; ob++){
    var oo = obstacles[ob];
    var os = worldToScreen(oo.x,oo.y);
    drawObstacle(oo, os[0], os[1]);
  }

  // ambient drifting ash/dust
  for (var em=0; em<embers.length; em++){
    var e = embers[em];
    var s = worldToScreen(e.x,e.y);
    var ea = (e.life/e.maxLife);
    drawGlowCircle(s[0],s[1],e.size,'#9a9286','#6b6458',ea*0.4);
  }

  // dim sodium-lamp pool around the player
  var psx = worldToScreen(player.x,player.y);
  var spot = ctx.createRadialGradient(psx[0],psx[1],0,psx[0],psx[1],230);
  spot.addColorStop(0,'rgba(255,180,90,0.08)');
  spot.addColorStop(1,'rgba(255,180,90,0)');
  ctx.fillStyle = spot;
  ctx.beginPath(); ctx.arc(psx[0],psx[1],230,0,Math.PI*2); ctx.fill();

  // blood decals on the floor
  for (var dc=0; dc<decals.length; dc++){
    var d = decals[dc];
    var s = worldToScreen(d.x,d.y);
    ctx.save();
    ctx.globalAlpha = d.alpha;
    ctx.fillStyle = d.color;
    for (var bb=0; bb<d.blobs.length; bb++){
      var blob = d.blobs[bb];
      ctx.beginPath(); ctx.arc(s[0]+blob.ox, s[1]+blob.oy, blob.rr, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // pickups
  for (var pk=0; pk<pickups.length; pk++){
    var pu = pickups[pk];
    var s = worldToScreen(pu.x,pu.y);
    var bob = Math.sin(pu.bob)*6;
    var pdef = PICKUP_DEFS[pu.type];
    drawGlowCircle(s[0],s[1]+bob,14,pdef.color,pdef.color,0.9);
    ctx.save();
    ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(pdef.sym, s[0], s[1]+bob+1);
    ctx.restore();
  }

  // particles
  for (var p=0;p<particles.length;p++){
    var pa = particles[p];
    var s = worldToScreen(pa.x,pa.y);
    var alpha = pa.life/pa.maxLife;
    drawGlowCircle(s[0],s[1],pa.size*alpha+1,pa.color,pa.color,alpha);
  }

  // zombies
  for (var z=0; z<zombies.length; z++){
    var zz = zombies[z];
    var s = worldToScreen(zz.x,zz.y);
    if (zz.type==='boss') drawBoss(zz, s[0], s[1]);
    else drawZombie(zz, s[0], s[1]);
    // health notch
    if (zz.hp < zz.maxHp){
      var hbw = zz.r*2;
      ctx.save();
      ctx.translate(s[0]-zz.r, s[1]-zz.r-12);
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,hbw,4);
      ctx.fillStyle=zz.glow; ctx.fillRect(0,0,hbw*Math.max(0,zz.hp/zz.maxHp),4);
      ctx.restore();
    }
  }

  // bullets
  for (var bi=0; bi<bullets.length; bi++){
    var bl = bullets[bi];
    var s = worldToScreen(bl.x,bl.y);
    drawGlowCircle(s[0],s[1],4,'#fffbe0','#ff5a3c',1);
  }

  // player
  if (gameState==='playing' || gameState==='gameover'){
    var ps = worldToScreen(player.x,player.y);
    ctx.save();
    ctx.translate(ps[0],ps[1]);
    ctx.rotate(player.angle);
    if (player.shieldTime>0){
      ctx.save(); ctx.globalAlpha=0.35+Math.sin(performance.now()/120)*0.1;
      ctx.strokeStyle='#3bbcff'; ctx.shadowColor='#3bbcff'; ctx.shadowBlur=20; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(0,0,32,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    if (player.invuln>0 && Math.floor(performance.now()/60)%2===0){
      ctx.globalAlpha = 0.4;
    }

    var moving = (Math.sqrt(stickL.dx*stickL.dx+stickL.dy*stickL.dy) > 0.12);
    var legSwing = moving ? Math.sin(player.walkPhase)*0.6 : 0;

    // legs
    ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
    ctx.strokeStyle = '#2b261d'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-4,4); ctx.lineTo(-15 - legSwing*8, 11 + Math.abs(legSwing)*4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-4,-4); ctx.lineTo(-15 + legSwing*8, -11 - Math.abs(legSwing)*4);
    ctx.stroke();

    // survivor jacket / torso
    ctx.shadowBlur = 10; ctx.shadowColor = '#000';
    var tgrad = ctx.createLinearGradient(-10,0,16,0);
    tgrad.addColorStop(0,'#3a3326'); tgrad.addColorStop(1,'#7a6b4a');
    ctx.fillStyle = tgrad;
    ctx.beginPath();
    ctx.moveTo(15,0); ctx.lineTo(3,10); ctx.lineTo(-11,6); ctx.lineTo(-11,-6); ctx.lineTo(3,-10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#1c1810'; ctx.lineWidth = 1.5; ctx.stroke();

    // head / gas-mask goggles
    ctx.fillStyle = '#23201a';
    ctx.beginPath(); ctx.arc(10,0,6,0,Math.PI*2); ctx.fill();
    ctx.shadowColor = '#ff5a3c'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#ff5a3c';
    ctx.beginPath(); ctx.ellipse(11.5,0,3.4,2.2,0,0,Math.PI*2); ctx.fill();

    // gun barrel
    ctx.shadowBlur = 4; ctx.shadowColor='#000';
    ctx.fillStyle = '#1a1814';
    ctx.fillRect(14,-2,15,4);

    // muzzle flash
    if (player.muzzleFlash>0){
      ctx.save();
      ctx.globalAlpha = Math.min(1, player.muzzleFlash/0.06);
      ctx.fillStyle = '#fff7cf'; ctx.shadowColor = '#ffe08a'; ctx.shadowBlur = 26;
      ctx.beginPath(); ctx.moveTo(29,0); ctx.lineTo(42,-6); ctx.lineTo(42,6); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }

  // floaters
  for (var fl=0; fl<floaters.length; fl++){
    var f = floaters[fl];
    var s = worldToScreen(f.x,f.y);
    ctx.save();
    ctx.globalAlpha = Math.max(0,f.life/f.maxLife);
    ctx.fillStyle = f.color;
    ctx.shadowColor = f.color; ctx.shadowBlur = 10;
    ctx.font = 'bold 16px sans-serif'; ctx.textAlign='center';
    ctx.fillText(f.text, s[0], s[1]);
    ctx.restore();
  }

  ctx.restore(); // shake translate

  // freeze pulse tint
  if (player.freezeTime>0){
    ctx.save();
    ctx.globalAlpha = Math.min(0.18, player.freezeTime*0.05);
    ctx.fillStyle = '#8fd9ff';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  // vignette
  var grad = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(0,0,0,0.65)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // scanlines
  ctx.save();
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = '#000';
  for (var ly=0; ly<H; ly+=3){ ctx.fillRect(0,ly,W,1); }
  ctx.restore();

  drawHUD();
  drawSticks();

  if (gameState==='start') drawStartScreen();
  if (gameState==='gameover') drawGameOver();
}

function neonText(text,x,y,size,color,align){
  ctx.save();
  ctx.font = 'bold '+size+'px sans-serif';
  ctx.textAlign = align||'left';
  ctx.textBaseline='middle';
  ctx.shadowColor = color; ctx.shadowBlur = 16;
  ctx.fillStyle = color;
  ctx.fillText(text,x,y);
  ctx.restore();
}

function drawHUD(){
  if (gameState!=='playing') return;
  // health bar
  var hbw = Math.min(220, W*0.4);
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(18,18,hbw,16);
  var pct = Math.max(0,player.hp/player.maxHp);
  ctx.fillStyle = pct>0.5 ? '#39ff8a' : pct>0.25 ? '#ffe93b' : '#ff3b3b';
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur=10;
  ctx.fillRect(18,18,hbw*pct,16);
  ctx.strokeStyle='#9a8a64'; ctx.lineWidth=1.5; ctx.strokeRect(18,18,hbw,16);
  ctx.restore();
  neonText('HP '+Math.ceil(player.hp), 24, 50, 13, '#fff', 'left');

  neonText('SCORE '+Math.floor(player.score), W-20, 30, 18, '#e8b04a', 'right');
  if (player.combo>1.05) neonText('x'+player.combo.toFixed(1)+' COMBO', W-20, 54, 13, '#ff5a3c', 'right');

  neonText('WAVE '+wave, W/2, 30, 16, '#fff', 'center');

  drawBuffs();

  if (waveBannerTime>0){
    var a = Math.min(1, waveBannerTime);
    ctx.save();
    ctx.globalAlpha = a;
    neonText(waveBanner, W/2, H*0.32, 34, '#ff5a3c', 'center');
    ctx.restore();
  }
}

function drawBuffs(){
  var buffs = [];
  if (player.rapidTime>0) buffs.push({t:'RAPID', c:'#ffe93b'});
  if (player.shieldTime>0) buffs.push({t:'SHIELD', c:'#3bbcff'});
  if (player.shotgunTime>0) buffs.push({t:'SHOTGUN', c:'#ff9a3c'});
  if (player.pierceTime>0) buffs.push({t:'PIERCE', c:'#7be8ff'});
  if (player.freezeTime>0) buffs.push({t:'FREEZE', c:'#8fd9ff'});
  if (player.magnumTime>0) buffs.push({t:'MAGNUM', c:'#ff5a3c'});
  if (!buffs.length) return;
  var spacing = 78;
  var startX = W/2 - (buffs.length-1)*spacing/2;
  for (var i=0;i<buffs.length;i++){
    neonText(buffs[i].t, startX+i*spacing, 56, 11, buffs[i].c, 'center');
  }
}

function drawSticks(){
  if (gameState!=='playing') return;
  // Fixed-position rings: always drawn at the same spot whether or not a
  // thumb is down, so the controls never "disappear" mid-fight. Active
  // sticks glow brighter; idle ones stay dim but visible.
  function ring(s, label, labelColor){
    ctx.save();
    ctx.globalAlpha = s.active ? 0.65 : 0.3;
    ctx.strokeStyle = '#c9b98a'; ctx.lineWidth=2; ctx.shadowColor='#c9b98a'; ctx.shadowBlur = s.active?12:4;
    ctx.beginPath(); ctx.arc(s.anchorX, s.anchorY, STICK_R_MAX, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = s.active ? 'rgba(201,185,138,0.3)' : 'rgba(201,185,138,0.12)';
    ctx.beginPath(); ctx.arc(s.x, s.y, 22, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    if (!s.active){
      ctx.save();
      ctx.globalAlpha = 0.45 + Math.sin(performance.now()/300)*0.1;
      neonText(label, s.anchorX, s.anchorY+STICK_R_MAX+22, 13, labelColor, 'center');
      ctx.restore();
    }
  }
  ring(stickL, 'MOVE', '#c9b98a');
  ring(stickR, 'AIM & FIRE', '#ff5a3c');
}

function drawStartScreen(){
  ctx.save();
  ctx.fillStyle = 'rgba(8,6,3,0.6)';
  ctx.fillRect(0,0,W,H);
  neonText('DEAD STREETS', W/2, H*0.32, Math.min(56,W*0.12), '#ff5a3c', 'center');
  neonText('QUARANTINE BLOCK', W/2, H*0.32+34, Math.min(16,W*0.04), '#c9b98a', 'center');
  ctx.globalAlpha = 0.7+Math.sin(performance.now()/250)*0.25;
  neonText('TAP TO START', W/2, H*0.55, 24, '#fff', 'center');
  ctx.globalAlpha = 1;
  neonText('LEFT THUMB: MOVE   |   RIGHT THUMB: AIM & SHOOT', W/2, H*0.62, 12, '#888', 'center');
  ctx.restore();
}

function drawGameOver(){
  ctx.save();
  ctx.fillStyle = 'rgba(8,6,3,0.75)';
  ctx.fillRect(0,0,W,H);
  neonText('YOU DIED', W/2, H*0.34, Math.min(48,W*0.1), '#ff3b3b', 'center');
  neonText('SCORE: '+finalScore, W/2, H*0.46, 22, '#e8b04a', 'center');
  neonText('WAVE REACHED: '+finalWave, W/2, H*0.46+30, 16, '#fff', 'center');
  ctx.globalAlpha = 0.7+Math.sin(performance.now()/250)*0.25;
  neonText('TAP TO RESTART', W/2, H*0.62, 22, '#fff', 'center');
  ctx.restore();
}

// ---------- Main loop ----------
function frame(t){
  var dt = Math.min(0.033, (t-lastT)/1000);
  lastT = t;
  camX = player.x; camY = player.y;
  try{
    update(dt);
    draw();
  } catch(e){
    console.error('frame error', e);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(function(t){ lastT=t; requestAnimationFrame(frame); });

})();
</script>
</body>
</html>
